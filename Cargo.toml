[package]
name = "pipeguard"
version = "0.1.0"
edition = "2021"
authors = ["Steeve-Crypto"]
description = "CI/CD pipeline security scanner and multi-format config converter (YAML ↔ JSON ↔ TOML)"
license = "MIT"
repository = "https://github.com/Steeve-Crypto/pipeguard"
keywords = ["security", "ci-cd", "github-actions", "yaml", "scanner"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
regex = "1.11"
colored = "2.1"
walkdir = "2.5"
once_cell = "1.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
