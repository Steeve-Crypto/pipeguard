name: "pipeguard"
description: "Scan CI/CD pipeline configs for security issues (secrets, unpinned actions, dangerous permissions, injection)"
author: "Steeve-Crypto"

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: "File or directory to scan (e.g. .github/workflows)"
    required: false
    default: ".github/workflows"
  min_severity:
    description: "Minimum severity to report: low | medium | high | critical"
    required: false
    default: "low"
  sarif:
    description: "Write SARIF results to this file path (empty = disabled)"
    required: false
    default: "pipeguard.sarif"
  fail_on_findings:
    description: "Fail the step if any findings meet min_severity"
    required: false
    default: "true"
  comment_pr:
    description: "Post a summary comment on the pull request when findings exist"
    required: false
    default: "false"
  token:
    description: "GitHub token used for PR comments (defaults to github.token)"
    required: false
    default: ${{ github.token }}

outputs:
  sarif_path:
    description: "Path to the SARIF file (if generated)"
    value: ${{ inputs.sarif }}
  findings_count:
    description: "Number of findings reported"
    value: ${{ steps.scan.outputs.findings_count }}

runs:
  using: composite
  steps:
    - name: Install pipeguard
      shell: bash
      run: |
        set -euo pipefail
        # Prefer crates.io binary (fast). Fall back to source build if needed.
        if cargo install pipeguard --version 0.1.0 --root "$HOME/.local" --force 2>/dev/null; then
          echo "Installed pipeguard from crates.io"
        else
          echo "crates.io install failed, building from source..."
          cargo install --path "${{ github.action_path }}" --locked --force --root "$HOME/.local"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run pipeguard scan
      id: scan
      shell: bash
      env:
        PIPEGUARD_PATH: ${{ inputs.path }}
        PIPEGUARD_MIN: ${{ inputs.min_severity }}
        PIPEGUARD_SARIF: ${{ inputs.sarif }}
        PIPEGUARD_FAIL: ${{ inputs.fail_on_findings }}
        RUST_LOG: off
      run: |
        set -euo pipefail

        if [[ ! -x "$HOME/.local/bin/pipeguard" ]]; then
          echo "pipeguard binary not found" >&2
          exit 1
        fi

        ARGS=(scan "$PIPEGUARD_PATH" --min-severity "$PIPEGUARD_MIN")
        FINDINGS=0

        if [[ -n "${PIPEGUARD_SARIF}" ]]; then
          pipeguard "${ARGS[@]}" --sarif > "$PIPEGUARD_SARIF"
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$PIPEGUARD_SARIF" 2>/dev/null; then
            echo "Invalid SARIF output written to $PIPEGUARD_SARIF" >&2
            head -c 200 "$PIPEGUARD_SARIF" >&2 || true
            exit 1
          fi
          FINDINGS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" "$PIPEGUARD_SARIF")
        else
          # Human output still goes to logs; capture count via JSON side channel
          TMP=$(mktemp)
          pipeguard "${ARGS[@]}" --json > "$TMP" || true
          FINDINGS=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d) if isinstance(d,list) else d.get('findings',0) if isinstance(d,dict) else 0)" "$TMP" 2>/dev/null || echo 0)
          rm -f "$TMP"
          pipeguard "${ARGS[@]}" || true
        fi

        echo "findings_count=$FINDINGS" >> "$GITHUB_OUTPUT"
        echo "pipeguard: $FINDINGS finding(s)"

        if [[ "$PIPEGUARD_FAIL" == "true" && "$FINDINGS" -gt 0 ]]; then
          echo "pipeguard: failing because findings were reported (fail_on_findings=true)" >&2
          exit 1
        fi

    - name: Comment on PR
      if: ${{ inputs.comment_pr == 'true' && github.event_name == 'pull_request' && steps.scan.outputs.findings_count != '0' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const count = '${{ steps.scan.outputs.findings_count }}';
          const body = `### pipeguard findings\n\nFound **${count}** potential CI/CD security issue(s).\n\nSee the job logs or the uploaded SARIF for details.`;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
